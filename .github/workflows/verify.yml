# §6 règle 5 : à chaque modification, vérifier le schéma, chaque URL, et
# télécharger entièrement (en flux) chaque ISO nouvelle ou modifiée pour
# contrôler sa somme.
name: Vérification du catalogue

on:
  push:
    paths: ["catalog.json", "catalog.schema.json", "scripts/**"]
  pull_request:
    paths: ["catalog.json", "catalog.schema.json", "scripts/**"]
  # Lancement manuel (onglet Actions → « Run workflow ») : sans version
  # précédente, toutes les ISO sont téléchargées et vérifiées (~135 Go).
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install jsonschema rfc3339-validator
      - name: Version précédente du catalogue
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git show "$base:catalog.json" > /tmp/old.json 2>/dev/null || echo '{"distros": []}' > /tmp/old.json
      # Les ISO « rolling » (Tumbleweed…) disparaissent quand un nouvel
      # instantané sort : une entrée non modifiée par ce push n'est pas
      # bloquante (update.yml la rafraîchit) ; une entrée modifiée doit être
      # parfaite.
      - name: Schéma, règles et URLs
        run: python scripts/verify.py --lenient-unchanged /tmp/old.json
      - name: Sommes de contrôle des entrées modifiées (téléchargement complet)
        run: python scripts/verify.py --full --changed-since /tmp/old.json
